<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fingerdoodle</title>
<meta name="description" content="A doodling page built for fingers on a touchscreen MacBook. Sketch, pinch to zoom, add shapes and text.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6f0e4'/%3E%3Cpath d='M6 22c5-13 7-13 9-6s4 6 11-6' fill='none' stroke='%232b2622' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/shantell-sans-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="board">
  <canvas id="scene" aria-label="Drawing canvas"></canvas>
  <canvas id="live" aria-hidden="true"></canvas>
  <p id="hint" class="gone">Drag to look around, pinch to zoom.<br>Tap the pencil to start drawing.</p>
  <textarea id="editor" hidden spellcheck="false" autocapitalize="sentences" aria-label="Text to add to the drawing"></textarea>
</main>

<div id="pan-banner" role="status">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6a1.6 1.6 0 0 1 3.2 0v5"/><path d="M11.2 11V4.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M14.4 11V6.4a1.6 1.6 0 0 1 3.2 0V14c0 4-2.6 7-6.4 7-3 0-4.4-1.4-5.6-3.6L3.4 13a1.5 1.5 0 0 1 2.5-1.6L8 14"/></svg>
  <strong>Pan mode</strong>
  <span id="pan-text"></span>
</div>

<div id="tray" role="toolbar" aria-label="Drawing tools">
  <div class="group">
    <button type="button" id="undo" aria-label="Undo" title="Undo (⌘Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12" transform="translate(0 -6)"/></svg></button>
    <button type="button" id="redo" aria-label="Redo" title="Redo (⇧⌘Z)" disabled><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12" transform="translate(0 -6)"/></svg></button>
  </div>

  <div class="group tools" id="tools">
    <span id="indicator" aria-hidden="true"></span>
    <button type="button" data-tool="pencil" aria-label="Pencil" title="Pencil (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.6 4a2.1 2.1 0 0 1 3 0l.4.4a2.1 2.1 0 0 1 0 3L8.6 18.8z"/><path d="m14.5 6 3.5 3.5"/></svg></button>
    <button type="button" data-tool="rect" aria-label="Rectangle" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
    <button type="button" data-tool="ellipse" aria-label="Circle" title="Circle (C). Hold Shift for a perfect circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
    <button type="button" data-tool="text" aria-label="Text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></button>
    <button type="button" data-tool="eraser" aria-label="Eraser" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="m8.5 19-4-4a2 2 0 0 1 0-2.8l8-8a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L12.5 19z"/><path d="m9 8 7.5 7.5"/><path d="M8.5 19H20"/></svg></button>
    <button type="button" data-tool="move" aria-label="Move a drawing" title="Move (V)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
    <button type="button" data-tool="hand" aria-label="Pan the canvas" title="Pan (Esc). Hold Space to pan for a moment"><svg viewBox="0 0 24 24"><path d="M8 12V6a1.6 1.6 0 0 1 3.2 0v5"/><path d="M11.2 11V4.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M14.4 11V6.4a1.6 1.6 0 0 1 3.2 0V14c0 4-2.6 7-6.4 7-3 0-4.4-1.4-5.6-3.6L3.4 13a1.5 1.5 0 0 1 2.5-1.6L8 14"/></svg></button>
  </div>

  <div class="group colors" id="colors">
    <button type="button" data-color="ink" aria-label="Ink"><i></i></button>
    <button type="button" data-color="red" aria-label="Red"><i></i></button>
    <button type="button" data-color="blue" aria-label="Blue"><i></i></button>
    <button type="button" data-color="green" aria-label="Green"><i></i></button>
    <button type="button" data-color="yellow" aria-label="Yellow"><i></i></button>
  </div>

  <div class="group sizes" id="sizes">
    <button type="button" data-size="0" aria-label="Thin line"><i></i></button>
    <button type="button" data-size="1" aria-label="Medium line"><i></i></button>
    <button type="button" data-size="2" aria-label="Thick line"><i></i></button>
  </div>

  <div class="group">
    <button type="button" id="zoom" class="zoom" aria-label="Fit drawing to screen" title="Fit to screen (0)">100%</button>
    <button type="button" id="save" aria-label="Save as PNG" title="Save as PNG" disabled><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></button>
    <button type="button" id="clear" aria-label="Clear the canvas" title="Clear the canvas (undo brings it back)" disabled><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="m6 7 1 13h10l1-13"/></svg></button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
